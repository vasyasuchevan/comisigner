<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificare semnătură — ComiSigner</title>
<style>
  :root {
    color-scheme: light;
    --ink: #0f172a;
    --muted: #64748b;
    --muted-soft: #94a3b8;
    --bg-alt: #f8fafc;
    --border: #e2e8f0;
    --accent-sky: #0ea5e9;
    --accent-indigo: #6366f1;
    --success: #16a34a;
    --success-bg: #f0fdf4;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --radius-lg: 20px;
    --radius-md: 12px;
    --shadow-card: 0 6px 20px rgba(2,6,23,0.05);
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font);
    margin: 0;
    padding: 24px 16px;
    color: var(--ink);
    min-height: 100vh;
    background:
      radial-gradient(1100px 550px at 85% -10%, rgba(14,165,233,0.13), transparent),
      radial-gradient(700px 380px at -10% 15%, rgba(99,102,241,0.10), transparent),
      linear-gradient(180deg, #ffffff 0%, var(--bg-alt) 100%);
  }
  .card {
    background: #fff;
    border-radius: var(--radius-lg);
    max-width: 480px;
    margin: 0 auto 16px;
    padding: 24px;
    box-shadow: var(--shadow-card);
    border: 1px solid var(--border);
  }
  h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 4px; text-align: center; }
  .subtitle { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 20px; line-height: 1.5; }
  .state-msg {
    text-align: center;
    color: var(--muted);
    padding: 28px 8px;
    font-size: 14.5px;
  }
  .state-msg.error { color: var(--danger); }
  .badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-align: center;
    border-radius: var(--radius-md);
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 18px;
    border: 1px solid transparent;
  }
  .badge.ok { background: var(--success-bg); color: var(--success); border-color: #bbf0cd; }
  .badge.bad { background: var(--danger-bg); color: var(--danger); border-color: #fecaca; }
  .badge .chain-icon { flex: none; width: 18px; height: 18px; }
  .field {
    margin-bottom: 10px;
    padding: 10px 12px;
    background: var(--bg-alt);
    border-radius: var(--radius-md);
  }
  .field label {
    display: block;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 3px;
  }
  .field .value {
    font-size: 13.5px;
    word-break: break-word;
  }
  .field .value.mono {
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 12px;
    word-break: break-all;
    background: #fff;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: block;
    margin-top: 2px;
  }
  .hint {
    font-size: 12px;
    color: var(--muted-soft);
    margin-top: 14px;
    line-height: 1.55;
  }
  .home-link {
    display: block;
    text-align: center;
    font-size: 13px;
    color: var(--accent-indigo);
    font-weight: 600;
    text-decoration: none;
    margin-top: 18px;
  }
  .home-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card">
  <h1>Verificare semnătură</h1>
  <div class="subtitle">Confirmare independentă a integrității unui document semnat</div>
  <div id="content">
    <div class="state-msg" id="stateMsg">Se verifică…</div>
  </div>
  <a class="home-link" href="/">← Pagina principală</a>
</div>

<script src="vendor/supabase.js"></script>
<script>
  var SUPABASE_URL = 'https://nyuuhxbyvqntcygbwzcp.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_T3BAn6CVhnFeNEV87UjULA_JnuCJYnx';
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
  });
</script>
<script>
(function () {
  var content = document.getElementById('content');

  function bufferToHex(buffer) {
    var bytes = new Uint8Array(buffer);
    var hex = '';
    for (var i = 0; i < bytes.length; i++) hex += bytes[i].toString(16).padStart(2, '0');
    return hex;
  }

  async function sha256Hex(text) {
    var enc = new TextEncoder();
    var digest = await crypto.subtle.digest('SHA-256', enc.encode(text));
    return bufferToHex(digest);
  }

  function showMessage(msg, isError) {
    content.innerHTML = '<div class="state-msg' + (isError ? ' error' : '') + '">' + msg + '</div>';
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  async function run() {
    var id = new URLSearchParams(location.search).get('id');
    if (!id) {
      showMessage('Acest link nu conține un cod de verificare valid.', true);
      return;
    }

    try {
      var result = await sb.rpc('verify_signed_document', { p_id: id });
      if (result.error) {
        showMessage('Eroare la verificare: ' + result.error.message, true);
        return;
      }
      var rows = result.data;
      if (!rows || rows.length === 0) {
        showMessage('Nu a fost găsită nicio înregistrare cu acest cod.', true);
        return;
      }
      var r = rows[0];

      var expected = await sha256Hex((r.prev_chain_hash || 'GENESIS') + '|' + r.hash);
      var chainOk = expected === r.chain_hash;

      var chainIconOk = '<svg class="chain-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 15l6-6"/><path d="M7 12l-2 2a3 3 0 0 0 4 4l2-2"/><path d="M17 12l2-2a3 3 0 0 0-4-4l-2 2"/></svg>';
      var chainIconBad = '<svg class="chain-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>';

      var html = '';
      html += '<div class="badge ' + (chainOk ? 'ok' : 'bad') + '">' +
        (chainOk ? chainIconOk + 'Integritate confirmată — poziția #' + r.seq + ' din lanțul de audit' : chainIconBad + 'ATENȚIE — această înregistrare nu se potrivește cu lanțul de audit') +
        '</div>';

      html += '<div class="field"><label>Șofer</label><div class="value">' + escapeHtml(r.driver_name) + '</div></div>';
      if (r.doc_title) {
        html += '<div class="field"><label>Document</label><div class="value">' + escapeHtml(r.doc_title) + (r.doc_type ? ' — ' + escapeHtml(r.doc_type) : '') + (r.doc_date ? ' (' + escapeHtml(r.doc_date) + ')' : '') + '</div></div>';
      }
      html += '<div class="field"><label>Data/ora semnării</label><div class="value">' + escapeHtml(r.signed_at) + '</div></div>';
      html += '<div class="field"><label>Hash SHA-256</label><div class="value mono">' + escapeHtml(r.hash) + '</div></div>';
      html += '<div class="hint">Această pagină recalculează independent poziția înregistrării în lanțul de audit (fiecare semnătură nouă înglobează hash-ul celei precedente) — fără a necesita autentificare. Dacă cineva ar modifica ulterior o înregistrare din arhivă, verificarea ar eșua vizibil aici.</div>';

      content.innerHTML = html;
    } catch (err) {
      showMessage('Eroare neașteptată: ' + (err.message || JSON.stringify(err)), true);
    }
  }

  run();
})();
</script>

</body>
</html>
