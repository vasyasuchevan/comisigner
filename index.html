<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComiSigner</title>
<style>
  :root {
    color-scheme: light;
    --ink: #0f172a;
    --muted: #64748b;
    --muted-soft: #94a3b8;
    --bg-alt: #f8fafc;
    --border: #e2e8f0;
    --accent-sky: #0ea5e9;
    --accent-indigo: #6366f1;
    --radius-lg: 20px;
    --radius-md: 12px;
    --shadow-card: 0 6px 20px rgba(2,6,23,0.05);
    --shadow-card-hover: 0 12px 28px rgba(2,6,23,0.09);
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font);
    margin: 0;
    padding: 20px;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(1100px 550px at 85% -10%, rgba(14,165,233,0.14), transparent),
      radial-gradient(700px 380px at -10% 15%, rgba(99,102,241,0.10), transparent),
      linear-gradient(180deg, #ffffff 0%, var(--bg-alt) 100%);
  }
  .wrap {
    max-width: 440px;
    width: 100%;
  }
  .mark {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent-sky), var(--accent-indigo));
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mark svg { width: 22px; height: 22px; }
  h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.02em;
    text-align: center;
    margin: 0 0 6px;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 14.5px;
    margin-bottom: 32px;
    line-height: 1.5;
  }
  a.card {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    background: #fff;
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: var(--shadow-card);
    text-decoration: none;
    color: var(--ink);
    margin-bottom: 14px;
    border: 1px solid var(--border);
    transition: box-shadow 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  a.card:hover {
    border-color: var(--accent-sky);
    box-shadow: var(--shadow-card-hover);
    transform: translateY(-1px);
  }
  a.card:focus-visible {
    outline: 2px solid var(--accent-sky);
    outline-offset: 2px;
  }
  .card-icon {
    flex: none;
    width: 40px;
    height: 40px;
    border-radius: var(--radius-md);
    background: var(--bg-alt);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent-indigo);
  }
  .card-icon svg { width: 20px; height: 20px; }
  .card .role {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 3px;
  }
  .card .desc {
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.45;
  }
  .foot {
    text-align: center;
    font-size: 12px;
    color: var(--muted-soft);
    margin-top: 22px;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
  </div>
  <h1>ComiSigner</h1>
  <div class="subtitle">Semnare electronică a documentelor pentru șoferi</div>

  <a class="card" href="driver/">
    <div class="card-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h6"/><path d="M8 17l2 2 4-4"/></svg>
    </div>
    <div>
      <div class="role">Sunt șofer</div>
      <div class="desc">Deschid linkul unui document primit de la birou și îl semnez.</div>
    </div>
  </a>

  <a class="card" href="office/">
    <div class="card-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/></svg>
    </div>
    <div>
      <div class="role">Sunt din birou</div>
      <div class="desc">Încarc documente, urmăresc statusul și verific semnăturile.</div>
    </div>
  </a>

  <div class="foot">Fiecare semnătură e legată criptografic de un jurnal de audit verificabil.</div>
</div>

</body>
</html>
